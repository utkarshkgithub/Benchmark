name: benchmark
description: Attendance tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  qr_flutter: ^4.1.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  logger: ^2.3.0
  device_info_plus: ^11.5.0
  geolocator: ^14.0.0
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.0.1
  vector_math: ^2.1.4
  safe_device: ^1.3.5
  app_security: ^1.0.7
  local_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/BENCHMARK.png
    - assets/icons/image.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/image.png"
  min_sdk_android: 21 # android min sdk min:16, default 21